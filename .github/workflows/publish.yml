name: Build and publish Xibo add-on
on:
  push:
    branches: [main]
    paths:
      - "xibo_signage_manager/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version from Home Assistant config
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version: "\(.*\)"/\1/p' xibo_signage_manager/config.yaml)
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Validate Python syntax
        run: python -m py_compile xibo_signage_manager/manager.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./xibo_signage_manager
          file: ./xibo_signage_manager/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/hubertpi/xibo-signage-manager:${{ steps.version.outputs.value }}
            ghcr.io/hubertpi/xibo-signage-manager:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
